version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      tooling:
        patterns:
          - 'prettier*'
          - 'typescript'
          - 'playwright'
          - 'sharp'
    ignore:
      - dependency-name: 'node'
      # @astrojs/check peers typescript ^5 || ^6; lift once it supports 7
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vienna
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - '*'
